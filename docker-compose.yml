services:

  caddy:
    build: ./caddy
    container_name: uti_caddy
    # Solo el 443. El puerto 80 de este servidor pertenece a otro proyecto, por
    # eso el Caddyfile emite certificados vía TLS-ALPN-01 y no HTTP-01.
    ports:
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi
      - frontend
    restart: always
    networks:
      - uti_network

  frontend:
    build: ./frontend
    container_name: uti_frontend
    environment:
      # Los rewrites de next.config.ts proxean /api/v1/* desde el servidor de
      # Next, así que el browser nunca hace peticiones cross-origin.
      FASTAPI_INTERNAL_URL: http://fastapi:8000
    depends_on:
      - fastapi
    restart: always
    networks:
      - uti_network

  fastapi:
    build: ./fastapi
    container_name: uti_fastapi
    env_file: .env
    # Atado a loopback: el acceso público entra por Caddy, que es quien aplica
    # TLS y rate limiting. Publicarlo en 0.0.0.0 saltaría ambos.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./fastapi:/app
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - ollama
    restart: always
    networks:
      - uti_network

  celery_worker:
    build:
      context: ./fastapi
      dockerfile: ../celery_worker/Dockerfile
    container_name: uti_celery
    env_file: .env
    volumes:
      - ./fastapi:/app
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - fastapi
    restart: always
    networks:
      - uti_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2

  redis:
    image: redis:7-alpine
    container_name: uti_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - uti_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

  ollama:
    build: ./ollama
    container_name: uti_ollama
    restart: always
    environment:
      # Mantiene el modelo residente en VRAM. Con el default (5m) Ollama lo
      # descarga tras la inactividad y la siguiente consulta paga la recarga
      # de 9 GB desde disco, que en frío tarda minutos y el chat parece colgado.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - uti_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
  ollama_data:
  uploads_data:
  # Guarda los certificados y la clave de cuenta ACME. Si se borra, Caddy vuelve
  # a emitir desde cero y puede topar con el rate limit de Let's Encrypt.
  caddy_data:
  caddy_config:

networks:
  uti_network:
    driver: bridge
