# Despliegue en Dokploy (VPS sin GPU): LLM y embeddings vía OpenAI.
# Sin Caddy ni Ollama: el Traefik de Dokploy pone TLS y enruta los dominios
# (configurados en la UI de Dokploy → frontend:3002, fastapi:8000).
# Sin `ports`: el 8000 del host ya lo usa otro proyecto.
# Sin bind mount del código: Dokploy re-clona el repo en cada deploy y un
# contenedor no recreado quedaría montando un directorio borrado (/app vacío).
# Variables: se definen en la pestaña Environment de Dokploy, que las escribe
# en .env junto a este archivo (ver .env.example).
services:

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    environment:
      FASTAPI_INTERNAL_URL: http://fastapi:8000
    depends_on:
      - fastapi
    restart: always

  fastapi:
    build: ./fastapi
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
    restart: always

  celery_worker:
    build:
      context: ./fastapi
      dockerfile: ../celery_worker/Dockerfile
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - fastapi
    restart: always
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=1

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

volumes:
  redis_data:
  uploads_data:
